name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connector-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r RadiologyConnector/plugins/horos-connector/requirements.txt -r RadiologyAgent/backend/requirements.txt
      - name: Installer tests
        run: python -m unittest discover -s tests -v
      - name: Connector tests
        working-directory: RadiologyConnector/plugins/horos-connector
        run: python -m pytest -q
      - name: Reporting API tests
        working-directory: RadiologyAgent
        run: python -m pytest backend/tests -q
      - name: Check connector source
        run: python RadiologyConnector/scripts/check_release.py
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RadiologyConnector/plugins/horos-connector/horos_connector/web/package-lock.json
      - run: npm ci --prefix RadiologyConnector/plugins/horos-connector/horos_connector/web
      - run: bash RadiologyAgent/scripts/test.sh
      - run: bash RadiologyAgent/scripts/build.sh
      - run: bash RadiologyAgent/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Radiology-Agent-macOS-research
          path: RadiologyAgent/dist/Radiology Agent-macOS.zip
